name: CI / Deploy

# PRs: typecheck + tests. Push to main (i.e. a merged PR): the same checks,
# then database migrations, then the Worker deploy, in that order. A failed
# migration stops the deploy, so new code never runs against an old schema.
# Migrations run before the new code is live, so keep them backward
# compatible with the currently deployed Worker (add first, drop later).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys (and two migration runs) at once.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate database (Neon)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build Worker
        run: pnpm exec opennextjs-cloudflare build
      # Worker secrets live in GitHub and ship with every deploy, so a fresh
      # Worker is fully configured on its first deploy and rotating one is
      # just `gh secret set` + rerun. Values are masked in the logs.
      - name: Deploy Worker
        run: |
          umask 077
          cat > "$RUNNER_TEMP/worker-secrets.env" <<EOF
          APP_PASSWORD_HASH=${APP_PASSWORD_HASH}
          SESSION_SECRET=${SESSION_SECRET}
          API_TOKEN=${API_TOKEN}
          CAPTURE_TOKEN=${CAPTURE_TOKEN}
          CRON_SECRET=${CRON_SECRET}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          EOF
          pnpm exec opennextjs-cloudflare deploy --secrets-file "$RUNNER_TEMP/worker-secrets.env"
          rm -f "$RUNNER_TEMP/worker-secrets.env"
        env:
          APP_PASSWORD_HASH: ${{ secrets.APP_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
