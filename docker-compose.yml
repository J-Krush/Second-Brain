# Local stand-ins for the production services. Postgres replaces Neon,
# MinIO replaces R2 (the app only ever talks S3). Ports match .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: secondbrain-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secondbrain
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secondbrain"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    container_name: secondbrain-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API  -> R2_ENDPOINT
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: create the private bucket the app expects, then exit. The
  # server image bundles `mc`, which avoids pulling a second image.
  minio-init:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/secondbrain-dev
      "

volumes:
  pgdata:
  miniodata:
